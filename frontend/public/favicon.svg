<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#10b981" stroke-width="0.5" opacity="0.4"/>

  <!-- Candlestick chart bars (trading icon) -->
  <rect x="5" y="18" width="3" height="8" rx="1" fill="#10b981" opacity="0.6"/>
  <rect x="6.5" y="15" width="0.5" height="3" fill="#10b981" opacity="0.4"/>
  <rect x="6.5" y="26" width="0.5" height="2" fill="#10b981" opacity="0.4"/>

  <rect x="10" y="12" width="3" height="10" rx="1" fill="#34d399"/>
  <rect x="11.5" y="9" width="0.5" height="3" fill="#34d399" opacity="0.6"/>
  <rect x="11.5" y="22" width="0.5" height="3" fill="#34d399" opacity="0.6"/>

  <rect x="15" y="8" width="3" height="14" rx="1" fill="url(#green)" filter="url(#glow)"/>
  <rect x="16.5" y="5" width="0.5" height="3" fill="#34d399"/>
  <rect x="16.5" y="22" width="0.5" height="3" fill="#34d399"/>

  <rect x="20" y="14" width="3" height="8" rx="1" fill="#ef4444" opacity="0.8"/>
  <rect x="21.5" y="11" width="0.5" height="3" fill="#ef4444" opacity="0.5"/>
  <rect x="21.5" y="22" width="0.5" height="2" fill="#ef4444" opacity="0.5"/>

  <rect x="25" y="10" width="3" height="12" rx="1" fill="#10b981"/>
  <rect x="26.5" y="7" width="0.5" height="3" fill="#10b981" opacity="0.6"/>
  <rect x="26.5" y="22" width="0.5" height="3" fill="#10b981" opacity="0.6"/>

  <!-- Trend line -->
  <polyline points="6.5,22 11.5,17 16.5,12 21.5,18 26.5,14"
    fill="none" stroke="#34d399" stroke-width="1" opacity="0.5" stroke-dasharray="2,1"/>
</svg>
